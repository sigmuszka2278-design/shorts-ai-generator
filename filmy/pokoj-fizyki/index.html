<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>TEN POKÓJ ŁAMIE PRAWA FIZYKI!</title>
<style>
  @font-face { font-family: 'Mont'; font-weight: 900; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Mont'; font-weight: 900; src: url('node_modules/@fontsource/montserrat/files/montserrat-latin-ext-900-normal.woff2') format('woff2');
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #ui { position: absolute; inset: 0; font-family: 'Mont', sans-serif; font-weight: 900; pointer-events: none; }
  .emo { height: 1em; width: 1em; vertical-align: -0.12em; margin-left: 0.12em; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  #title { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    font-size: 47px; color: #fff; background: #e3192b; padding: 14px 30px 12px; border-radius: 18px; letter-spacing: 0.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #tag { position: absolute; top: 218px; left: 50%; transform: translateX(-50%); font-size: 28px; color: rgba(255,255,255,.92);
    letter-spacing: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.8); white-space: nowrap; }
  #sticker { position: absolute; top: 330px; left: 50%; font-size: 86px; line-height: 1.05; color: #ffe23d; text-align: center; white-space: nowrap;
    -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.35); }
  #subs { position: absolute; top: 1300px; left: 50%; width: 900px; transform: translateX(-50%); text-align: center;
    font-size: 74px; line-height: 1.12; color: #fff; -webkit-text-stroke: 13px #000; paint-order: stroke fill;
    text-shadow: 0 8px 0 rgba(0,0,0,.5); }
  #subs span { display: inline-block; margin: 0 12px; transform-origin: 50% 70%; }
  #subs span.on { color: #ffe23d; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui">
  <div id="title"></div>
  <div id="tag">ANIMACJA 3D · FANTASY</div>
  <div id="sticker"></div>
  <div id="subs"></div>
</div>
<script type="module">
import { createWorld } from './src/scene.js';
import { setupCaptions } from './src/captions.js';

const params = new URLSearchParams(location.search);
await document.fonts.load('900 80px Mont', 'ĄĘŚŻŹĆŃÓŁ ąęśżźćńół');
const voice = await (await fetch('./build/voice.json')).json();
const world = await createWorld(document.getElementById('c'));
const captions = setupCaptions(voice);
window.renderFrame = (t) => { world.renderFrame(t); captions(t); return true; };
if (params.has('t')) window.renderFrame(parseFloat(params.get('t')));
window.ready = true;
</script>
</body>
</html>
